[project]
name = "reservas"
version = "1.1.0"
description = "Sistema local de reservas de equipos de laboratorio"
requires-python = ">=3.11"

# Las dependencias se fijan en requirements.txt (ver requirements.in).
# El paquete no se instala: pytest y uvicorn lo encuentran en src/.

[tool.pytest.ini_options]
# "tests" va en pythonpath para que `import helpers` resuelva con cualquier modo de
# importacion. Sin esta linea la suite solo corre con el modo "prepend", el actual
# por defecto, y falla al colectar con --import-mode=importlib.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
